name: Build dist

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'rust/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-dist.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'rust/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-dist.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-dist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: npm ci

      - name: Build spark-rs
        run: npm run build:wasm

      - name: Build Dist
        run: npm run build

      - name: Upload distribution
        uses: actions/upload-artifact@v7
        with:
          name: spark-dist
          path: dist/
          retention-days: 14
